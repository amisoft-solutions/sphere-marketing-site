# SPHERE demo-request Worker. Stays on a workers.dev hostname.
# The API stays on workers.dev. video.spheresce.com is a Worker custom domain for expiring links only.
# Approval mail stays off until the video host resolves and Email Sending is onboarded.
#
# Replace <d1-database-id> after `npx wrangler d1 create sphere-demo-requests`.
# Do not put account ids, API tokens, or the admin password in this file.
# Secrets (set with `wrangler secret put`, never committed):
#   ADMIN_PASSWORD
#   RATE_LIMIT_SALT
#   NOTIFY_TO          (only if email is later turned on)
#   RESEND_API_KEY     (only if EMAIL_PROVIDER is resend)
#   VIDEO_LINK_SECRET  (signs per-person video links)

name = "sphere-demo-requests"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# account_id = "<account-id>"

[[d1_databases]]
binding = "DB"
database_name = "sphere-demo-requests"
database_id = "<d1-database-id>"
migrations_dir = "migrations"

[vars]
# Exact browser origins. Add a preview origin here at deploy time if you need one.
# Do not commit an organization hostname.
ALLOWED_ORIGINS = "https://www.spheresce.com,https://spheresce.com"
# Production stays closed to localhost. Local wrangler dev sets ALLOW_LOCALHOST=true in .dev.vars.
ALLOW_LOCALHOST = "false"
# Secure session cookie in production. For `wrangler dev` over http, set COOKIE_SECURE=false in .dev.vars.
COOKIE_SECURE = "true"
# Admin notification email stays off. See README.
NOTIFY_EMAIL_ENABLED = "false"
EMAIL_PROVIDER = "off"
# Approval mail to the requester. Leave false until https://video.spheresce.com resolves
# and spheresce.com is onboarded to Email Sending. The message has no response address.
APPROVAL_EMAIL_ENABLED = "false"
EMAIL_FROM = "Logic Pursuits Representative <no-reply@spheresce.com>"
VIDEO_URL = "https://video.spheresce.com"
VIDEO_LINK_TTL_DAYS = "7"

# Recipients stay unrestricted. The sender cannot drift from this address.
# Arbitrary recipients require Workers Paid.
[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["no-reply@spheresce.com"]

[[routes]]
pattern = "video.spheresce.com"
custom_domain = true

[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "sphere-video-overview"
